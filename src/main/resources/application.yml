server:
  port: 9192

api-gateway-base-url: ${API_GATEWAY_BASE_URL:http://localhost:8222}

spring:
  application:
    name: audit-compliance-service

  config:
    import: optional:configserver:${CONFIG_SERVER_BASE_URL:http://config-server.default.svc.cluster.local:8888}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/audit_compliance_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      resource server:
        jwt:
          issuer-uri: ${keycloak.server-url}/realms/${keycloak.realm}

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 10MB
      max-request-size: 10MB

rabbitmq:
  create-resource-queue: create-demo-resource-queue
  delete-resource-queue: delete-demo-resource-queue
  change-resource-status-queue: change-demo-resource-status-queue

audit-compliance:
  rabbitmq:
    queues:
      accounts-payable-audit: accounts-payable-audit-queue
      accounts-payable-sync: accounts-payable-sync-queue
      accounts-receivable-audit: accounts-receivable-audit-queue
      asset-finance-audit: asset-finance-audit-queue
      asset-finance-sync: asset-finance-sync-queue
      budget-management-audit: budget-management-audit-queue
      cash-banking-audit: cash-banking-audit-queue
      cash-banking-sync: cash-banking-sync-queue
      employee-finance-audit: employee-finance-audit-queue
      employee-finance-sync: employee-finance-sync-queue
      finance-admin-audit: finance-admin-audit-queue
      finance-admin-sync: finance-admin-sync-queue
      financial-reporting-audit: financial-reporting-audit-queue
      general-ledger-audit: general-ledger-audit-queue
      gl-actual-sync: gl-actual-sync-queue
      org-structure-sync: org-structure-sync-queue

keycloak:
  server-url: http://172.20.136.100:30282
  realm: saas-erp
  client-id: saas-client
  client-secret: APHalzvUVsfz9Jffe5ZAZ1XImFwv5a8K
  openIdConnectUrl: ${keycloak.server-url}/realms/${keycloak.realm}/.well-known/openid-configuration

springdoc:
  swagger-ui:
    oauth:
      client-id: ${keycloak.client-id}
      client-secret: ${keycloak.client-secret}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://172.20.136.100:8761/eureka/

